# Bei einem Tag: Oberflaeche bauen und als Archiv an das Release haengen.
# Damit braucht niemand Node auf dem Zielrechner - run.py holt sich das
# Archiv selbst, wenn npm fehlt.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Archiv packen
        run: |
          tar -czf frontend-dist.tar.gz -C frontend dist
          sha256sum frontend-dist.tar.gz > frontend-dist.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend-dist.tar.gz
            frontend-dist.tar.gz.sha256
          generate_release_notes: true
