# Bei einem Tag: Oberflaeche bauen und als Archiv an das Release haengen.
# Damit braucht niemand Node auf dem Zielrechner - run.py holt sich das
# Archiv selbst, wenn npm fehlt.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # Herkunftsnachweis ohne eigenen Schluessel
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Archiv packen
        run: |
          tar -czf frontend-dist.tar.gz -C frontend dist
          sha256sum frontend-dist.tar.gz > frontend-dist.tar.gz.sha256

      # Was in dem Archiv steckt, soll nachvollziehbar sein, ohne es zu
      # entpacken - und ohne dem Wort "vertrauenswuerdig" zu glauben.
      - name: Stueckliste
        uses: anchore/sbom-action@v0
        with:
          path: frontend
          format: spdx-json
          artifact-name: sparbit-frontend.spdx.json
          output-file: sparbit-frontend.spdx.json

      - name: Herkunftsnachweis
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: frontend-dist.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend-dist.tar.gz
            frontend-dist.tar.gz.sha256
            sparbit-frontend.spdx.json
          generate_release_notes: true
