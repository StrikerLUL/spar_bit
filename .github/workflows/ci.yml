# Was bei jedem Push laeuft. Absicht: niemand soll auf dem VPS merken,
# was der Rechner hier schon haette sagen koennen.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install ruff pytest-cov
      - name: Linter
        run: ruff check .
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: Abdeckung sichern
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  diff-abdeckung:
    # Die Gesamtschwelle (75 %) traegt den Bestand. Sie sagt aber nichts
    # darueber, ob *neuer* Code getestet ist: ein ungetestetes Modul faellt
    # in einer grossen Codebasis nicht auf. Diese Pruefung schaut nur auf
    # die geaenderten Zeilen.
    name: Abdeckung der geaenderten Zeilen
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - run: pip install diff-cover
      - name: Vergleichen
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 80 \
            --markdown-report diff-abdeckung.md
      - name: Bericht in die Zusammenfassung
        if: always()
        run: cat diff-abdeckung.md >> "$GITHUB_STEP_SUMMARY" || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Linter
        run: npm run lint
        working-directory: frontend
      - name: Typen
        run: npm run typecheck
        working-directory: frontend
      - name: Tests
        run: npm run test:ci
        working-directory: frontend
      - name: Bauen
        run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  api-vertrag:
    # Der API-Client der Oberflaeche war lange handgeschrieben. Hier wird
    # geprueft, dass die erzeugten Typen noch zum OpenAPI-Schema des
    # Backends passen - sonst faellt eine umbenannte Antwort erst im
    # Browser auf, und zwar als "undefined".
    name: Oberflaeche gegen OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Schema erzeugen
        run: python backend/tools/openapi_export.py frontend/openapi.json
      - name: Typen erzeugen und vergleichen
        working-directory: frontend
        run: |
          npm run api:types
          if ! git diff --quiet -- src/lib/api-typen.ts; then
            echo "::error::Die erzeugten API-Typen sind veraltet."
            echo "Bitte lokal ausfuehren und mit einchecken:"
            echo "  python backend/tools/openapi_export.py frontend/openapi.json"
            echo "  npm --prefix frontend run api:types"
            git diff -- src/lib/api-typen.ts
            exit 1
          fi

  e2e:
    name: Durchstich im Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Browser holen
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Durchstich
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-bericht
          path: frontend/playwright-report
          retention-days: 7

  audit:
    # Nicht blockierend fuer Backend und Oberflaeche getrennt: ein bekannter
    # Fund in einer Abhaengigkeit soll sichtbar sein, aber nicht den Stand
    # aller offenen PRs rot faerben, solange kein Update existiert.
    name: Bekannte Luecken in Abhaengigkeiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc on || echo "::warning::pip-audit hat etwas gefunden - siehe oben."
      - run: npm ci
        working-directory: frontend
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit hat etwas gefunden - siehe oben."

  docker:
    name: Images bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend-Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: docker-compose pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfiguration aufloesen
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          # Auch den HTTPS-Pfad aufloesen: dort steckt die Caddy-Vorlage,
          # und ein Tippfehler faellt sonst erst auf dem VPS auf.
          SPARBIT_DOMAIN=beispiel.de docker compose --profile https config >/dev/null
