# Steht noch ein Proxy davor (Caddy, Traefik, nginx, Nginx Proxy Manager),
# terminiert der das HTTPS und spricht hier drinnen nur HTTP. $scheme waere
# dann "http" - das Session-Cookie bekaeme kein Secure-Flag. Darum den Wert
# des aeusseren Proxys uebernehmen, wenn er einen schickt.
map $http_x_forwarded_proto $sparbit_proto {
    default    $scheme;
    "https"    "https";
    "http"     "http";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hinter Caddy/Traefik gibt der aeussere Proxy die echten Header vor.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SSE-Stream: Puffern ausschalten, sonst kommt der Live-Ticker nie an.
    location /api/events {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sparbit_proto;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sparbit_proto;
        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }

    # Gehashte Assets duerfen lange liegen bleiben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: alles andere auf index.html, damit Deep-Links funktionieren.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
