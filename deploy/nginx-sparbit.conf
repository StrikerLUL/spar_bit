# SparBit hinter einem nginx, der auf dem Host schon laeuft.
#
#   1. Kopieren und Domain eintragen:
#        sudo cp deploy/nginx-sparbit.conf /etc/nginx/sites-available/sparbit
#        sudo sed -i 's/DEINE-DOMAIN/spar-bit.example.de/' \
#                 /etc/nginx/sites-available/sparbit
#        sudo ln -s /etc/nginx/sites-available/sparbit /etc/nginx/sites-enabled/
#   2. Pruefen und neu laden:
#        sudo nginx -t && sudo systemctl reload nginx
#   3. Zertifikat holen - certbot baut diesen Block selbst auf HTTPS um:
#        sudo certbot --nginx -d spar-bit.example.de
#
# Voraussetzung: in der .env steht SPARBIT_WEB_BIND=127.0.0.1, damit der
# Container-Port nicht zusaetzlich offen im Netz haengt.

upstream sparbit {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name DEINE-DOMAIN;

    # Backup-Import schickt eine JSON-Datei; die Vorgabe von 1 MB ist dafuer
    # zu knapp. Der nginx im Container erlaubt an dieser Stelle dasselbe.
    client_max_body_size 8m;

    access_log /var/log/nginx/sparbit.access.log;
    error_log  /var/log/nginx/sparbit.error.log;

    # Der Live-Ticker ist ein SSE-Stream: eine Verbindung, die stundenlang
    # offen bleibt und haeppchenweise sendet. Wird sie gepuffert, kommt nie
    # etwas an; mit der ueblichen Lesezeit von 60 s bricht sie im
    # Minutentakt ab. Darum eine eigene Location.
    location /api/events {
        proxy_pass http://sparbit;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://sparbit;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Daran erkennt SparBit HTTPS und setzt das Session-Cookie mit
        # Secure. Faellt der Header weg, bleibt das Flag aus.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}
