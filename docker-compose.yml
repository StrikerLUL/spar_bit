name: sparbit

services:
  backend:
    # Fertiges Image aus der GitHub-Registry. Steht es lokal nicht bereit,
    # baut Compose aus dem Quellbaum daneben - ein Fork oder ein eigener
    # Commit laeuft also weiter, ohne dass hier etwas umgestellt werden
    # muss. SPARBIT_TAG setzt der Auto-Updater auf den Commit, den er
    # gerade ausgecheckt hat; "latest" ist der Stand ohne Updater.
    image: ${SPARBIT_IMAGE_BACKEND:-ghcr.io/strikerlul/sparbit-backend}:${SPARBIT_TAG:-latest}
    build:
      # Wurzel als Kontext, damit cli.py mit ins Image geht.
      context: .
      dockerfile: backend/Dockerfile
    container_name: sparbit-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SPARBIT_DATA_DIR: /data
      SPARBIT_CLAIMER_LOG_DIR: /claimer-data
    volumes:
      - sparbit-data:/data
      # Nur lesend: das UI parst die Claimer-Logs, schreibt dort aber nichts.
      - claimer-data:/claimer-data:ro
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    image: ${SPARBIT_IMAGE_FRONTEND:-ghcr.io/strikerlul/sparbit-frontend}:${SPARBIT_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    container_name: sparbit-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    ports:
      # Steht ein Reverse-Proxy davor - der mitgelieferte Caddy oder ein
      # schon vorhandener -, gehoert hier 127.0.0.1 hin: dann ist der Port
      # nur lokal offen. Ohne Proxy bleibt er offen, sonst kaeme man gar
      # nicht erst rein.  Umschalten mit SPARBIT_WEB_BIND in der .env.
      - "${SPARBIT_WEB_BIND:-0.0.0.0}:${SPARBIT_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Der Scheduler als eigener Dienst. Laeuft nur mit "--profile worker",
  # und nur dann sinnvoll, wenn in der .env SPARBIT_SCHEDULER=aus steht -
  # sonst sammeln beide ein und jeder Deal kommt doppelt.
  #
  # Fuer den Normalfall ist das nicht noetig: ein Prozess reicht. Gedacht
  # fuer Anlagen, in denen das Einsammeln die Oberflaeche traege macht.
  worker:
    image: ${SPARBIT_IMAGE_BACKEND:-ghcr.io/strikerlul/sparbit-backend}:${SPARBIT_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sparbit-worker
    restart: unless-stopped
    profiles: ["worker"]
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SPARBIT_DATA_DIR: /data
      SPARBIT_CLAIMER_LOG_DIR: /claimer-data
      # Hier laeuft der Scheduler - egal, was fuer den API-Prozess gilt.
      SPARBIT_SCHEDULER: auto
    volumes:
      - sparbit-data:/data
      - claimer-data:/claimer-data:ro
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Auto-Claimer: Epic + Prime Gaming + GOG.
  # Konfiguration folgt der README von vogler/free-games-claimer.
  # Beim ersten Start muss man sich einmal interaktiv anmelden -
  # siehe README.md, Abschnitt "Auto-Claimer".
  claimer:
    image: ghcr.io/vogler/free-games-claimer:latest
    container_name: sparbit-claimer
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Zeitplan im Container (Cron). Leer = einmalig beim Start.
      SCHEDULE: ${CLAIMER_SCHEDULE:-0 4 * * *}
      # Nach dem Lauf nicht beenden, damit SCHEDULE greift.
      SHOW: "0"
      # Zugangsdaten aus .env
      EG_EMAIL: ${EG_EMAIL:-}
      EG_PASSWORD: ${EG_PASSWORD:-}
      EG_OTPKEY: ${EG_OTPKEY:-}
      PG_EMAIL: ${PG_EMAIL:-}
      PG_PASSWORD: ${PG_PASSWORD:-}
      PG_OTPKEY: ${PG_OTPKEY:-}
      GOG_EMAIL: ${GOG_EMAIL:-}
      GOG_PASSWORD: ${GOG_PASSWORD:-}
      NOTIFY: ${NOTIFY:-}
    volumes:
      # Persistente Login-Sessions - ohne das musst du dich staendig neu anmelden.
      - claimer-data:/fgc/data
    ports:
      # VNC zum einmaligen interaktiven Anmelden (siehe README).
      # Nur an localhost gebunden - nicht ins Internet haengen.
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6080:6080"
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # HTTPS-Vorschaltung. Laeuft nur mit "--profile https", also nur dann,
  # wenn in der .env eine Domain steht. Caddy holt und erneuert das
  # Zertifikat selbst - es gibt hier nichts zu konfigurieren und nichts,
  # was in 90 Tagen ablaeuft und vergessen wird.
  caddy:
    image: caddy:2-alpine
    container_name: sparbit-caddy
    restart: unless-stopped
    profiles: ["https"]
    environment:
      # Kein ":?" hier: Compose loest die ganze Datei auf, bevor Profile
      # ueberhaupt betrachtet werden. Eine Pflichtvariable an dieser Stelle
      # wuerde also auch "docker compose up backend frontend" scheitern
      # lassen, wo es gar keinen Caddy gibt. Geprueft wird darum erst beim
      # Start des Containers - siehe command unten.
      SPARBIT_DOMAIN: ${SPARBIT_DOMAIN:-}
      SPARBIT_ACME_MAIL: ${SPARBIT_ACME_MAIL:-}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$SPARBIT_DOMAIN" ]; then
          echo "SPARBIT_DOMAIN fehlt in der .env." >&2
          echo "Ohne Domain gibt es kein HTTPS - dann ohne '--profile https' starten." >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  sparbit-data:
  claimer-data:
  caddy-data:
  caddy-config:
